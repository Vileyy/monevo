services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-monevo}
      POSTGRES_USER: ${POSTGRES_USER:-monevo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-monevo} -d ${POSTGRES_DB:-monevo}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-monevo}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-monevo}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set to a long random value in deploy/.env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_IOS_CLIENT_ID: ${GOOGLE_IOS_CLIENT_ID}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      LEGAL_APP_NAME: ${LEGAL_APP_NAME:-Monevo}
      LEGAL_CONTACT_EMAIL: ${LEGAL_CONTACT_EMAIL:-support@monevo.app}
      LEGAL_LAST_UPDATED: ${LEGAL_LAST_UPDATED:-2026-10-22}
      DEMO_EMAIL: ${DEMO_EMAIL:-demo@monevo.app}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      DEMO_NAME: ${DEMO_NAME:-Monevo Demo}

volumes:
  postgres_data:
