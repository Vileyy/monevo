name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  HUSKY: "0"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm and Node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@22
          cache: true

      - name: Generate Prisma client
        working-directory: backend
        run: pnpm exec prisma generate

      - name: Lint
        run: pnpm --filter backend lint:check

      - name: Type check
        run: pnpm --filter backend exec tsc --noEmit -p tsconfig.build.json

      - name: Test
        run: pnpm --filter backend test

      - name: Build
        run: pnpm --filter backend build

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm and Node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@22
          cache: true

      - name: Lint
        run: pnpm --filter frontend lint

      - name: Type check
        run: pnpm --filter frontend typecheck

      - name: Test
        run: pnpm --filter frontend exec jest --ci

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm and Node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@22
          cache: true

      - name: Security audit
        run: pnpm audit --audit-level=high
