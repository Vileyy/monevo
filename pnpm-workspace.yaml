packages:
  - "frontend"
  - "backend"
overrides:
  nanoid@3: "3.3.18"
  nanoid@5: ">=5.1.6"
  js-yaml@3: ">=3.15.2"
  js-yaml@4: ">=4.3.2"
  js-yaml@5: "5.2.2"
  deepmerge-ts: ">=8.0.0"
  mysql2: ">=3.22.0"
  fast-uri: ">=3.1.6"
  proxy-addr: ">=2.0.8"
  shell-quote: ">=1.11.0"
  multer: ">=2.3.0"
  source-map-js: ">=1.2.2"
  compression: ">=1.8.2"
  minimatch@3>brace-expansion: "1.1.21"
  minimatch@5>brace-expansion: "2.1.7"
  minimatch@10>brace-expansion: "5.0.12"
  "@xmldom/xmldom": ">=0.9.12"
audit:
  ignore:
    # image-size@2.0.3 is not on npm yet; latest is 2.0.2 (dev-only via Metro)
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq
    - GHSA-ggr8-5vv4-36mx
    # node-forge@1.4.1 is not on npm yet; latest is 1.4.0
    - GHSA-86w9-cpqp-85rv
    # braces@3.0.4 is not on npm yet; latest is 3.0.3
    - GHSA-vfj7-8cjw-p6xm
allowBuilds:
  '@clerk/shared': true
  '@prisma/engines': true
  '@scarf/scarf': false
  bcrypt: true
  browser-tabs-lock: true
  bufferutil: true
  core-js: true
  prisma: true
  unrs-resolver: false
  utf-8-validate: true
publicHoistPattern:
  - '*babel*'
